<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211920">
  <link rel="icon" href="mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>Coastline Atelier | Photo poster studio</title>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-undo" viewBox="0 0 24 24"><path d="M9 5 4 10l5 5M4 10h10a5 5 0 0 1 0 10h-3"/></symbol>
    <symbol id="icon-redo" viewBox="0 0 24 24"><path d="m15 5 5 5-5 5m5-5H10a5 5 0 0 0 0 10h3"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/></symbol>
    <symbol id="icon-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-wide" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1"/></symbol>
    <symbol id="icon-tall" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1"/></symbol>
    <symbol id="icon-square" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/></symbol>
  </svg>
  <header class="mast">
    <div class="brand">
      <img src="mark.svg" alt="" width="38" height="38">
      <div>
        <h1>Coastline Atelier</h1>
        <p>Photo poster studio</p>
      </div>
    </div>
    <div class="actions">
      <div class="history" role="group" aria-label="Edit history">
        <button id="undo" class="icon-button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg><use href="#icon-undo"/></svg></button>
        <button id="redo" class="icon-button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled><svg><use href="#icon-redo"/></svg></button>
      </div>
      <button id="export" class="primary" disabled><svg><use href="#icon-download"/></svg>Export PNG</button>
    </div>
  </header>
  <main class="workspace">
    <section class="preview" aria-labelledby="preview-title">
      <div class="section-head">
        <h2 id="preview-title">Cover preview</h2>
        <span class="dimensions" id="dimensions">1920 × 1080 px</span>
      </div>
      <div class="stage" id="stage" data-size="landscape">
        <div class="artboard">
          <canvas id="cover" aria-label="Cover preview. Select a panel and use arrow keys to pan it." tabindex="0"></canvas>
          <svg id="selection" class="selection" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><polygon/></svg>
          <span id="drop-hint">Drop to add photos</span>
        </div>
      </div>
      <div class="preview-foot">
        <div class="panel-row" id="panels" role="group" aria-label="Select photo panel"></div>
        <p>Drag to crop <span aria-hidden="true">/</span> Scroll to zoom</p>
      </div>
    </section>
    <section class="library" aria-labelledby="library-title">
      <div class="section-head">
        <div>
          <h2 id="library-title">Photos</h2>
          <p id="assign-hint">Choose a photo for Panel 1.</p>
        </div>
        <button id="add-photo" class="quiet"><svg><use href="#icon-add"/></svg>Add photos</button>
        <input id="upload" type="file" accept="image/*" multiple hidden>
      </div>
      <div class="filmstrip" id="photos" aria-label="Available photos"></div>
      <p class="library-foot" id="status" role="status">Drop photos anywhere. Images stay on your device.</p>
    </section>
    <aside class="inspector" aria-label="Poster settings">
      <section class="inspector-group" aria-labelledby="composition-title">
        <h2 id="composition-title">Composition</h2>
        <div class="segments sizes" role="group" aria-label="Export size">
          <button data-size="landscape" aria-pressed="true" title="1920 × 1080"><svg><use href="#icon-wide"/></svg>Wide</button>
          <button data-size="portrait" aria-pressed="false" title="1080 × 1350"><svg><use href="#icon-tall"/></svg>Portrait</button>
          <button data-size="square" aria-pressed="false" title="1080 × 1080"><svg><use href="#icon-square"/></svg>Square</button>
        </div>
        <label class="select-row" for="layout">Layout
          <select id="layout">
            <option value="coast">Coastline Six</option>
            <option value="boulevard">Three Lanes</option>
            <option value="tidal">Cross Current</option>
          </select>
        </label>
        <div class="range-label"><label for="zoom" id="crop-label">Panel 1 zoom</label><button id="reset" class="text-button">Reset crop</button></div>
        <div class="range-row"><input id="zoom" type="range" min="1" max="3" step=".01" value="1"><output id="zoom-value" for="zoom">1.00×</output></div>
        <label class="stacked" for="sceneLabel">Scene label
          <input id="sceneLabel" type="text" maxlength="60" autocomplete="off" dir="auto">
        </label>
        <div class="control-row">
          <label class="checkbox-label"><input id="showLabels" type="checkbox"> Show scene labels</label>
          <button id="fill-all" class="quiet">Fill all panels</button>
        </div>
      </section>
      <section class="inspector-group" aria-labelledby="grade-title">
        <h2 id="grade-title">Color grade</h2>
        <div class="segments grade-presets" role="group" aria-label="Color grade">
          <button data-grade="sunset" aria-pressed="true"><span class="swatch sunset"></span>Sunset</button>
          <button data-grade="neon" aria-pressed="false"><span class="swatch neon"></span>Neon</button>
          <button data-grade="ink" aria-pressed="false"><span class="swatch ink"></span>Ink</button>
        </div>
        <label for="intensity">Intensity</label>
        <div class="range-row"><input id="intensity" type="range" min="0" max="100" value="74"><output id="intensity-value" for="intensity">74%</output></div>
      </section>
      <section class="inspector-group" aria-labelledby="type-title">
        <div class="section-head">
          <h2 id="type-title">Lettering</h2>
          <button id="clear-lettering" class="text-button">Clear lettering</button>
        </div>
        <label class="stacked" for="caption">Title
          <input id="caption" type="text" value="Salt &amp; Static" maxlength="100" autocomplete="off" dir="auto">
        </label>
        <label class="stacked" for="subtitle">Subtitle
          <input id="subtitle" type="text" value="The coast after dark" maxlength="100" autocomplete="off" dir="auto">
        </label>
        <label class="select-row" for="type">Style
          <select id="type">
            <option value="marquee">Marquee</option>
            <option value="minimal">Minimal</option>
          </select>
        </label>
        <label for="typeScale">Title size</label>
        <div class="range-row"><input id="typeScale" type="range" min="65" max="115" step="1" value="100"><output id="typeScale-value" for="typeScale">100%</output></div>
      </section>
    </aside>
  </main>
  <script type="module" src="studio.js"></script>
</body>
</html>
